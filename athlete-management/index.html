<style>
:root {
  --ink: #18130f;
  --title-bg: #0d0d0d;
  --day-bg: #e10600;
  --day-bg-dark: #b80500;
  --hdr-bg: #f1ebe8;
  --note-bg: #f6f1ee;
  --border: #ddd3ce;
  --muted: #6b615d;
  --page-bg: #faf7f5;
  --card-bg: #ffffff;
  --white: #ffffff;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f1e9e4;
    --hdr-bg: #241d1a;
    --note-bg: #1e1815;
    --border: #3a322e;
    --muted: #ab9e98;

}
:root[data-theme="dark"] {
  --ink: #f1e9e4;
  --hdr-bg: #241d1a;

  --border: #3a322e;
  --muted: #ab9e98;
  --page-bg: #100d0b;
  --card-bg: #1a1512;
  --white: #ffffff;
}
/* ALWAYS-DARK */
:root { color-scheme: dark;
  --ink: #f1e9e4;
  --hdr-bg: #241d1a;
  --note-bg: #1e1815;
  --border: #3a322e;
  --muted: #ab9e98;
  --page-bg: #100d0b;
  --card-bg: #1a1512;
  --white: #ffffff;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--page-bg);
  color: var(--ink);
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
h1, h2 { font-family: var(--font-display); text-wrap: balance; letter-spacing: 0.01em; }
.logo { width: min(560px, 100%); height: auto; margin-bottom: 22px; }
h1 { font-size: 38px; font-weight: 700; margin: 0 0 8px; text-align: center; }
.tagline { color: var(--muted); font-size: 17px; margin: 0 0 40px; text-align: center; }
.collections { display: grid; gap: 48px; max-width: 900px; width: 100%; }
.collection-head { display: flex; align-items: baseline; gap: 14px; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.collection-head h2 { font-size: 30px; margin: 0; }
.collection-head p { color: var(--muted); font-size: 14px; margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; width: 100%; max-width: 900px; }
.empty {
  border: 1px dashed var(--border);
  border-radius: 14px;
  padding: 28px 26px;
  color: var(--muted);
  font-size: 14px;
  text-align: center;
}
.tile {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 30px 26px;
  text-decoration: none;
  color: var(--ink);
  border-top: 5px solid var(--day-bg);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.tile:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
.tile-eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--day-bg); }
.tile h2 { font-size: 26px; margin: 0; }
.tile p { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.5; }
.tile-cta { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.03em; color: var(--day-bg); margin-top: 8px; }
.tile:hover .tile-cta { color: var(--day-bg-dark); }
footer { margin-top: 44px; color: var(--muted); font-size: 12px; text-align: center; }
@media (max-width: 860px) {
  .tiles { grid-template-columns: 1fr; }
  .collection-head { flex-direction: column; gap: 4px; }
}
.back { align-self: flex-start; width: min(900px, 100%); margin: 0 auto 18px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.03em; color: var(--day-bg); text-decoration: none; }
.back:hover { color: var(--day-bg-dark); }
