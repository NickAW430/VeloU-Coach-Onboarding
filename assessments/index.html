<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="VeloU assessments: initial intake and re-testing.">
<title>Assessments · VeloU</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* VeloU brand palette: black, white, red E10600, blue 56B7E6, green 88E0C6, grey 5B6770. Always dark. */
:root {
  color-scheme: dark;
  --bg: #000000; --ink: #ffffff; --muted: #a8a8a8;
  --red: #e10600; --blue: #56b7e6; --green: #88e0c6; --grey: #5b6770;
  --font: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; background: transparent; color: var(--ink); font-family: var(--font);
  display: flex; flex-direction: column; align-items: center; padding: 28px 20px 56px;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: url("../assets/topo-bg.webp") center / cover no-repeat;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
  mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.back {
  align-self: flex-start; width: min(700px, 100%); margin: 0 auto 18px; padding: 0; text-align: left;
  background: none; border: 0; cursor: pointer; font: 700 14px var(--font); letter-spacing: 0.03em; color: #fff; text-decoration: none;
}
.back:hover { text-decoration: underline; }
.back[hidden] { display: none; }
.logo { width: min(400px, 100%); height: auto; margin-bottom: 44px; }
.step { width: 100%; max-width: 700px; }
.question { font-size: 32px; font-weight: 700; text-align: center; margin: 0 0 8px; text-wrap: balance; letter-spacing: 0.01em; }
.crumbs { color: var(--muted); font-size: 14px; text-align: center; margin: 0 0 28px; min-height: 1.4em; }
.options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.options.three { grid-template-columns: repeat(3, 1fr); }
.option {
  display: flex; flex-direction: column; justify-content: space-between; gap: 40px; text-align: left; width: 100%;
  min-height: 150px; padding: 22px 24px; border: 0; border-radius: 14px; color: #fff; font: inherit; cursor: pointer;
  background: linear-gradient(180deg, rgba(22,22,22,0.92) 0%, rgba(22,22,22,0) 100%);
  transition: transform 0.15s ease, background 0.15s ease;
}
.option:hover { transform: translateY(-3px); background: linear-gradient(180deg, rgba(34,34,34,0.95) 0%, rgba(34,34,34,0) 100%); }
.option:focus-visible, .back:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.letter {
  flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 16px; background: var(--red); color: #fff;
}
.option[data-c="1"] .letter { background: var(--blue); color: #000; }
.option[data-c="2"] .letter { background: var(--green); color: #000; }
.option[data-c="3"] .letter { background: var(--grey); color: #fff; }
.option-label { font-size: 24px; font-weight: 700; letter-spacing: 0.01em; }
.result { border-radius: 14px; padding: 36px 28px; text-align: center; background: linear-gradient(180deg, rgba(22,22,22,0.92) 0%, rgba(22,22,22,0) 100%); }
.result h2 { font-size: 30px; margin: 0 0 8px; }
.result p { color: var(--muted); margin: 0; }
@media (max-width: 700px) { .options, .options.three { grid-template-columns: 1fr; } .option { min-height: 0; } }
</style>
</head>
<body>

<button class="back" id="back" type="button" hidden>← Back</button>
<a class="back" id="home" href="../">← All of VeloU</a>
<img class="logo" src="../assets/velou-logo.webp" alt="VeloU New York and VeloU Texas" width="2000" height="881">
<h1 class="sr-only">Assessments</h1>
<p id="tagline" hidden></p>

<div class="step" id="step" aria-live="polite"></div>

<script>
const TREE = {
  question: "Which type of assessment are you completing?",
  options: [
    { key: "intake", label: "Initial Intake", next: {
      question: "What level assessment are you completing?",
      options: [
        { key: "basic", label: "Basic" },
        { key: "advanced", label: "Advanced" },
        { key: "premier", label: "Premier" }
      ] } },
    { key: "retest", label: "Re-Testing", next: {
      question: "What section of re-testing are you completing?",
      options: [
        { key: "biometrics", label: "Biometrics" },
        { key: "force-plates", label: "Force Plates" },
        { key: "athletic-testing", label: "Athletic Testing" },
        { key: "throwing", label: "Throwing Assessment" },
        { key: "mound", label: "Mound Assessment" },
        { key: "body-comp", label: "Body Composition" },
        { key: "mental-skills", label: "Mental Skills" }
      ] } }
  ]
};
const LETTERS = "ABCDEFGHIJ";
const stepEl = document.getElementById("step");
const backEl = document.getElementById("back");
const homeEl = document.getElementById("home");
const taglineEl = document.getElementById("tagline");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function render() {
  const path = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  let node = TREE, trail = [];
  for (const key of path) {
    const opt = node.options && node.options.find(o => o.key === key);
    if (!opt) { path.length = 0; node = TREE; trail = []; break; }
    trail.push(opt);
    if (opt.next) node = opt.next; else { node = null; break; }
  }
  stepEl.replaceChildren();
  backEl.hidden = trail.length === 0;
  homeEl.hidden = trail.length > 0;
  const crumbs = trail.map(t => t.label).join(" › ");
  if (node) {
    taglineEl.textContent = "";
    stepEl.append(el("h2", "question", node.question), el("p", "crumbs", crumbs));
    const grid = el("div", "options" + (node.options.length === 3 ? " three" : ""));
    node.options.forEach((o, i) => {
      const b = el("button", "option"); b.type = "button"; b.dataset.c = i % 4;
      b.append(el("span", "letter", LETTERS[i]), el("span", "option-label", o.label));
      b.addEventListener("click", () => { location.hash = "#/" + path.concat(o.key).join("/"); });
      grid.append(b);
    });
    stepEl.append(grid);
  } else {
    const r = el("div", "result");
    r.append(el("h2", "", crumbs), el("p", "", "This assessment form is coming next."));
    stepEl.append(r);
  }
  window.scrollTo(0, 0);
}

backEl.addEventListener("click", () => {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  parts.pop();
  location.hash = parts.length ? "#/" + parts.join("/") : "#/";
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = LETTERS.indexOf(e.key.toUpperCase());
  const btns = stepEl.querySelectorAll(".option");
  if (e.key.length === 1 && i > -1 && btns[i]) btns[i].click();
});
window.addEventListener("hashchange", render);
render();
</script>

</body>
</html>
