<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="VeloU assessments: initial intake and re-testing.">
<title>Assessments · VeloU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Design tokens, type and components follow the Coach Onboarding site (onboarding/assets/velou.css). */
:root{
  color-scheme: dark;
  --bg:#100D0B; --panel:#1B1714; --panel-2:#231E1A; --line:#352D28;
  --text:#F1E9E4; --muted:#AA9F97; --faint:#766B63;
  --red:#E5534B; --lime:#D4F57A; --cool:#7E93A6; --amber:#E0C04A;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#000;overflow-x:clip}
body{
  margin:0; background:transparent; color:var(--text); font-family:var(--body); font-size:17px; line-height:1.55;
  padding-inline:20px; padding-block:0 64px; overflow-x:clip;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:url("../assets/topo-bg.webp") center / cover no-repeat;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 70%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 70%,transparent 100%);
}
.wrap{max-width:980px;margin:0 auto}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0;text-transform:uppercase}
h1{font-size:clamp(34px,6vw,60px)}
p{margin:0;max-width:66ch}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

/* top navigation */
.homebar{position:sticky;top:0;z-index:50;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0;background:rgba(16,13,11,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.homelink{font:600 13px var(--label);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:6px 12px;color:var(--muted);text-decoration:none;background:var(--panel);cursor:pointer}
.homelink:hover{border-color:var(--red);color:var(--text)}

/* header */
header{padding-block:40px 28px;display:grid;gap:18px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{font:600 13px var(--label);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:4px 10px;color:var(--muted)}
.chip.on{border-color:var(--red);color:var(--red)}
.lede{font-size:19px;color:var(--muted)}

/* step */
section{padding-block:40px 8px;display:grid;gap:22px}
.sec-head{display:grid;gap:8px}
.sec-head .num{font:700 14px var(--label);color:var(--red);letter-spacing:.14em;text-transform:uppercase}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mods.three{grid-template-columns:repeat(3,1fr)}
.md{
  background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);padding:16px;display:grid;gap:6px;
  text-align:left;color:var(--text);font:inherit;align-content:start;cursor:pointer;width:100%;
  transition:border-color .15s,box-shadow .15s,transform .15s;
}
.md:hover{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 6px 18px rgba(229,83,75,.18);transform:translateY(-2px)}
.md .n{font:400 34px/1 var(--display);color:var(--c)}
.md b{font:700 18px var(--label);text-transform:uppercase;letter-spacing:.03em}
.md::after{content:"Select \2192";justify-self:start;margin-top:4px;font:700 12px var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.rule{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--panel);border-left:3px solid var(--red);padding:14px 18px}
.rule .label{font:600 13px var(--label);text-transform:uppercase;letter-spacing:.12em;color:var(--red);padding-top:3px}
@media (max-width:820px){.mods,.mods.three{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.mods,.mods.three{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="homebar">
  <button class="homelink" id="back" type="button" hidden>← Back</button>
  <a class="homelink" href="../">← VeloU Home</a>
</div>
<header>
  <div class="crumbs" id="crumbs"></div>
  <h1 id="question"></h1>
</header>
<section id="step" aria-live="polite"></section>
</div>

<script>
const TREE = {
  question: "Which type of assessment are you completing?",
  options: [
    { key: "intake", label: "Initial Intake", next: {
      question: "What level assessment are you completing?",
      options: [
        { key: "basic", label: "Basic" },
        { key: "advanced", label: "Advanced" },
        { key: "premier", label: "Premier" }
      ] } },
    { key: "retest", label: "Re-Testing", next: {
      question: "What section of re-testing are you completing?",
      options: [
        { key: "biometrics", label: "Biometrics" },
        { key: "force-plates", label: "Force Plates" },
        { key: "athletic-testing", label: "Athletic Testing" },
        { key: "throwing", label: "Throwing Assessment" },
        { key: "mound", label: "Mound Assessment" },
        { key: "body-comp", label: "Body Composition" },
        { key: "mental-skills", label: "Mental Skills" }
      ] } }
  ]
};
const LETTERS = "ABCDEFGHIJ";
const COLORS = ["var(--amber)", "var(--lime)", "var(--red)", "var(--cool)"];
const stepEl = document.getElementById("step");
const crumbsEl = document.getElementById("crumbs");
const questionEl = document.getElementById("question");
const backEl = document.getElementById("back");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function render() {
  const path = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  let node = TREE, trail = [];
  for (const key of path) {
    const opt = node.options && node.options.find(o => o.key === key);
    if (!opt) { path.length = 0; node = TREE; trail = []; break; }
    trail.push(opt);
    if (opt.next) node = opt.next; else { node = null; break; }
  }
  backEl.hidden = trail.length === 0;
  crumbsEl.replaceChildren(el("span", "chip" + (trail.length ? "" : " on"), "Assessments"));
  trail.forEach((t, i) => crumbsEl.append(el("span", "chip" + (i === trail.length - 1 ? " on" : ""), t.label)));
  stepEl.replaceChildren();
  if (node) {
    questionEl.textContent = node.question;
    const head = el("div", "sec-head");
    head.append(el("span", "num", trail.length ? "Step 2" : "Step 1"));
    const grid = el("div", "mods" + (node.options.length === 3 ? " three" : ""));
    node.options.forEach((o, i) => {
      const b = el("button", "md"); b.type = "button"; b.style.setProperty("--c", COLORS[i % COLORS.length]);
      b.append(el("span", "n", LETTERS[i]), el("b", "", o.label));
      b.addEventListener("click", () => { location.hash = "#/" + path.concat(o.key).join("/"); });
      grid.append(b);
    });
    stepEl.append(head, grid);
  } else {
    questionEl.textContent = trail.map(t => t.label).join(" · ");
    const r = el("div", "rule");
    r.append(el("span", "label", "Coming next"), el("p", "", "This assessment form hasn't been built yet."));
    stepEl.append(r);
  }
  window.scrollTo(0, 0);
}

backEl.addEventListener("click", () => {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  parts.pop();
  location.hash = parts.length ? "#/" + parts.join("/") : "#/";
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = LETTERS.indexOf(e.key.toUpperCase());
  const btns = stepEl.querySelectorAll(".md");
  if (e.key.length === 1 && i > -1 && btns[i]) btns[i].click();
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
