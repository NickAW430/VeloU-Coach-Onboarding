<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="VeloU assessments: initial intake and re-testing.">
<title>Assessments · VeloU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/portal.css?v=3">
</head>
<body>
<div class="wrap">
<div class="homebar">
  <button class="homelink" id="back" type="button" hidden>← Back</button>
  <a class="homelink" href="/">← VeloU Home</a>
</div>
<header>
  <div class="crumbs" id="crumbs"></div>
  <h1 id="title"></h1>
  <p class="lede" id="sub"></p>
</header>
<section id="step" aria-live="polite"></section>
</div>

<script src="/assessments/specs.js?v=1"></script>
<script src="/assessments/form.js?v=1"></script>
<script>
const TREE = {
  title: "Assessment Type",
  sub: "Which type of assessment are you completing today?",
  options: [
    { key: "intake", label: "Initial Intake", next: {
      title: "Assessment Level",
      sub: "Which level of assessment are you completing today?",
      options: [
        { key: "basic", label: "Basic" },
        { key: "advanced", label: "Advanced" },
        { key: "premier", label: "Premier" }
      ] } },
    { key: "retest", label: "Re-Testing", next: {
      title: "Re-Testing Section",
      colors: ["#E10600", "#56B7E6", "#88E0C6", "#ffffff", "#5B6770", "#F2C94C", "#FF8A3D"],
      sub: "Which section of re-testing are you completing today?",
      options: [
        { key: "biometrics", label: "Biometrics" },
        { key: "force-plates", label: "Force Plates" },
        { key: "athletic-testing", label: "Athletic Testing" },
        { key: "throwing", label: "Throwing Assessment" },
        { key: "mound", label: "Mound Assessment" },
        { key: "body-comp", label: "Body Composition" },
        { key: "mental-skills", label: "Mental Skills" }
      ] } }
  ]
};
const LETTERS = "ABCDEFGHIJ";
const COLORS = ["var(--red)", "var(--blue)", "var(--green)", "#ffffff"];
const stepEl = document.getElementById("step");
const crumbsEl = document.getElementById("crumbs");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const backEl = document.getElementById("back");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function render() {
  const path = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  let node = TREE, trail = [];
  for (const key of path) {
    const opt = node.options && node.options.find(o => o.key === key);
    if (!opt) { path.length = 0; node = TREE; trail = []; break; }
    trail.push(opt);
    if (opt.next) node = opt.next; else { node = null; break; }
  }
  backEl.hidden = trail.length === 0;
  crumbsEl.replaceChildren(el("span", "chip" + (trail.length ? "" : " on"), "Assessments"));
  trail.forEach((t, i) => crumbsEl.append(el("span", "chip" + (i === trail.length - 1 ? " on" : ""), t.label)));
  stepEl.replaceChildren();
  if (node) {
    titleEl.textContent = node.title;
    subEl.textContent = node.sub;
    const grid = el("div", "mods" + (node.options.length === 3 ? " three" : ""));
    node.options.forEach((o, i) => {
      const b = el("button", "md"); b.type = "button"; b.style.setProperty("--c", (node.colors || COLORS)[i % (node.colors || COLORS).length]);
      const pick = el("span", "pick");
      pick.append(el("span", "bk", "[" + LETTERS[i] + "]"), el("span", "lbl", o.label));
      const go = el("span", "go", "Select "); go.append(el("i", "", "→"));
      b.append(pick, go);
      b.addEventListener("click", () => { location.hash = "#/" + path.concat(o.key).join("/"); });
      grid.append(b);
    });
    stepEl.append(grid);
  } else if (trail.length === 2 && trail[0].key === "intake") {
    VeloUForm.mount(trail[1].key, {
      container: stepEl,
      setHeader: (t, s) => { titleEl.textContent = t; subEl.textContent = s; },
    });
  } else {
    titleEl.textContent = trail.map(t => t.label).join(" · ");
    subEl.textContent = "";
    stepEl.append(el("div", "rule", "This assessment form hasn't been built yet."));
  }
  window.scrollTo(0, 0);
}

backEl.addEventListener("click", () => {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  parts.pop();
  location.hash = parts.length ? "#/" + parts.join("/") : "#/";
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const i = LETTERS.indexOf(e.key.toUpperCase());
  const btns = stepEl.querySelectorAll(".md");
  if (e.key.length === 1 && i > -1 && btns[i]) btns[i].click();
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
