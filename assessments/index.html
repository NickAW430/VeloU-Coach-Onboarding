<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="VeloU assessments: initial intake and re-testing.">
<title>Assessments · VeloU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/portal.css?v=1">
</head>
<body>
<div class="topbar">
  <button id="back" type="button" hidden>← Back</button>
  <a href="/">← All of VeloU</a>
</div>
<img class="logo" src="/assets/velou-logo.webp" alt="VeloU New York and VeloU Texas" width="2000" height="881">
<h1 class="page-title" id="title"></h1>
<p class="page-sub" id="sub"></p>
<div id="step" aria-live="polite" style="width:100%;max-width:700px"></div>
<script>
const TREE = {
  title: "Assessment Type",
  sub: "Choose which type of assessment you are completing today.",
  options: [
    { key: "intake", label: "Initial Intake", next: {
      title: "Assessment Level",
      sub: "Choose which level of assessment you are completing today.",
      options: [
        { key: "basic", label: "Basic" },
        { key: "advanced", label: "Advanced" },
        { key: "premier", label: "Premier" }
      ] } },
    { key: "retest", label: "Re-Testing", next: {
      title: "Re-Testing Section",
      sub: "Choose which section of re-testing you are completing today.",
      options: [
        { key: "biometrics", label: "Biometrics" },
        { key: "force-plates", label: "Force Plates" },
        { key: "athletic-testing", label: "Athletic Testing" },
        { key: "throwing", label: "Throwing Assessment" },
        { key: "mound", label: "Mound Assessment" },
        { key: "body-comp", label: "Body Composition" },
        { key: "mental-skills", label: "Mental Skills" }
      ] } }
  ]
};
const LETTERS = "ABCDEFGHIJ";
const COLORS = ["var(--red)", "var(--blue)", "var(--green)", "#ffffff"];
const stepEl = document.getElementById("step");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const backEl = document.getElementById("back");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function render() {
  const path = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  let node = TREE, trail = [];
  for (const key of path) {
    const opt = node.options && node.options.find(o => o.key === key);
    if (!opt) { path.length = 0; node = TREE; trail = []; break; }
    trail.push(opt);
    if (opt.next) node = opt.next; else { node = null; break; }
  }
  backEl.hidden = trail.length === 0;
  stepEl.replaceChildren();
  if (node) {
    titleEl.textContent = node.title;
    subEl.textContent = node.sub;
    const grid = el("div", "tiles");
    node.options.forEach((o, i) => {
      const b = el("button", "tile"); b.type = "button"; b.style.setProperty("--c", COLORS[i % COLORS.length]);
      const pick = el("span", "pick");
      pick.append(el("span", "bk", "[" + LETTERS[i] + "]"), el("span", "pick-label", o.label));
      b.append(pick);
      b.addEventListener("click", () => { location.hash = "#/" + path.concat(o.key).join("/"); });
      grid.append(b);
    });
    stepEl.append(grid);
  } else {
    titleEl.textContent = trail.map(t => t.label).join(" · ");
    subEl.textContent = "";
    stepEl.append(el("div", "note", "This assessment form hasn't been built yet."));
  }
  window.scrollTo(0, 0);
}

backEl.addEventListener("click", () => {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  parts.pop();
  location.hash = parts.length ? "#/" + parts.join("/") : "#/";
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = LETTERS.indexOf(e.key.toUpperCase());
  const btns = stepEl.querySelectorAll(".tile");
  if (e.key.length === 1 && i > -1 && btns[i]) btns[i].click();
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
