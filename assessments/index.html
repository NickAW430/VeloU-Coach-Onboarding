<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="VeloU assessments: initial intake and re-testing.">
<title>Assessments · VeloU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@300;400;500;600;700&display=swap">
<style>
/* Layout and surfaces follow the Coach Onboarding site; accents use the VeloU brand colors. */
:root{
  color-scheme: dark;
  --bg:#100D0B; --panel:#1B1714; --line:#352D28; --grid:rgba(255,255,255,.035);
  --text:#F1E9E4; --muted:#AA9F97;
  --red:#E10600; --blue:#56B7E6; --green:#88E0C6; --grey:#5B6770;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}
html{background:var(--bg);overflow-x:clip}
body{
  margin:0; background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;
  color:var(--text); font-family:var(--body); font-size:17px; line-height:1.55;
  padding-inline:20px; padding-block:0 64px; overflow-x:clip; min-height:100vh;
}
.wrap{max-width:980px;margin:0 auto}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,38px);letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0;text-transform:uppercase}
p{margin:0;max-width:66ch}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

.homebar{position:sticky;top:0;z-index:50;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0;background:rgba(16,13,11,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.homelink{font:600 13px var(--body);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:6px 12px;color:var(--muted);text-decoration:none;background:var(--panel);cursor:pointer}
.homelink:hover{border-color:var(--red);color:var(--text)}

header{padding-block:36px 24px;display:grid;gap:14px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{font:600 13px var(--body);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:4px 10px;color:var(--muted)}
.chip.on{border-color:var(--red);color:var(--red)}
.lede{font-size:18px;color:var(--muted)}

section{padding-block:32px 8px}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mods.three{grid-template-columns:repeat(3,1fr)}
.md{
  background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);padding:22px 18px 18px;
  display:grid;gap:18px;text-align:left;color:var(--text);font:inherit;align-content:start;cursor:pointer;width:100%;
}
.pick{display:flex;align-items:baseline;gap:8px}
.bk{font-weight:700;font-size:26px;color:var(--c);letter-spacing:.02em}
.lbl{font-weight:300;font-size:26px;line-height:1.15}
.md::after{content:"Select \2192";justify-self:start;font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.rule{background:var(--panel);border-left:3px solid var(--red);padding:14px 18px;color:var(--muted)}
@media (max-width:820px){.mods,.mods.three{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.mods,.mods.three{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="homebar">
  <button class="homelink" id="back" type="button" hidden>← Back</button>
  <a class="homelink" href="/">← VeloU Home</a>
</div>
<header>
  <div class="crumbs" id="crumbs"></div>
  <h1 id="title"></h1>
  <p class="lede" id="sub"></p>
</header>
<section id="step" aria-live="polite"></section>
</div>

<script>
const TREE = {
  title: "Assessment Type",
  sub: "Which type of assessment are you completing today?",
  options: [
    { key: "intake", label: "Initial Intake", next: {
      title: "Assessment Level",
      sub: "Which level of assessment are you completing today?",
      options: [
        { key: "basic", label: "Basic" },
        { key: "advanced", label: "Advanced" },
        { key: "premier", label: "Premier" }
      ] } },
    { key: "retest", label: "Re-Testing", next: {
      title: "Re-Testing Section",
      sub: "Which section of re-testing are you completing today?",
      options: [
        { key: "biometrics", label: "Biometrics" },
        { key: "force-plates", label: "Force Plates" },
        { key: "athletic-testing", label: "Athletic Testing" },
        { key: "throwing", label: "Throwing Assessment" },
        { key: "mound", label: "Mound Assessment" },
        { key: "body-comp", label: "Body Composition" },
        { key: "mental-skills", label: "Mental Skills" }
      ] } }
  ]
};
const LETTERS = "ABCDEFGHIJ";
const COLORS = ["var(--red)", "var(--blue)", "var(--green)", "#ffffff"];
const stepEl = document.getElementById("step");
const crumbsEl = document.getElementById("crumbs");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const backEl = document.getElementById("back");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function render() {
  const path = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  let node = TREE, trail = [];
  for (const key of path) {
    const opt = node.options && node.options.find(o => o.key === key);
    if (!opt) { path.length = 0; node = TREE; trail = []; break; }
    trail.push(opt);
    if (opt.next) node = opt.next; else { node = null; break; }
  }
  backEl.hidden = trail.length === 0;
  crumbsEl.replaceChildren(el("span", "chip" + (trail.length ? "" : " on"), "Assessments"));
  trail.forEach((t, i) => crumbsEl.append(el("span", "chip" + (i === trail.length - 1 ? " on" : ""), t.label)));
  stepEl.replaceChildren();
  if (node) {
    titleEl.textContent = node.title;
    subEl.textContent = node.sub;
    const grid = el("div", "mods" + (node.options.length === 3 ? " three" : ""));
    node.options.forEach((o, i) => {
      const b = el("button", "md"); b.type = "button"; b.style.setProperty("--c", COLORS[i % COLORS.length]);
      const pick = el("span", "pick");
      pick.append(el("span", "bk", "[" + LETTERS[i] + "]"), el("span", "lbl", o.label));
      b.append(pick);
      b.addEventListener("click", () => { location.hash = "#/" + path.concat(o.key).join("/"); });
      grid.append(b);
    });
    stepEl.append(grid);
  } else {
    titleEl.textContent = trail.map(t => t.label).join(" · ");
    subEl.textContent = "";
    stepEl.append(el("div", "rule", "This assessment form hasn't been built yet."));
  }
  window.scrollTo(0, 0);
}

backEl.addEventListener("click", () => {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  parts.pop();
  location.hash = parts.length ? "#/" + parts.join("/") : "#/";
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = LETTERS.indexOf(e.key.toUpperCase());
  const btns = stepEl.querySelectorAll(".md");
  if (e.key.length === 1 && i > -1 && btns[i]) btns[i].click();
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
